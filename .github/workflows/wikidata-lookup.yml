# Temporär: Label-Sprachen prüfen.
name: wikidata-lookup
on:
  push:
    branches: [claude/wikidata-lookup]
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Labels
        shell: bash
        run: |
          UA='GameRegal-dev/0.1 (https://github.com/OveStridson/GameRegal)'
          for id in Q12395 Q54913666 Q96482598; do
            curl -sS -G 'https://www.wikidata.org/w/api.php' -A "$UA" --data-urlencode format=json --data-urlencode action=wbgetentities --data-urlencode ids=$id --data-urlencode props=labels \
              | jq -r ".entities.$id.labels | \"$id keys=\" + (keys|map(select(.==\"de\" or .==\"en\" or .==\"mul\"))|join(\",\")) + \" mul=\" + (.mul.value // \"-\") + \" | anzahl=\" + (length|tostring)"
            curl -sS -G 'https://www.wikidata.org/w/api.php' -A "$UA" --data-urlencode format=json --data-urlencode action=wbgetentities --data-urlencode ids=$id --data-urlencode props=labels --data-urlencode 'languages=de|en|mul' \
              | jq -c ".entities.$id.labels"
          done
